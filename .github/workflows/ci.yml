name: CI

on:
  pull_request:
    branches: [ "main" ]
  
  # 允許手動觸發 (Optional)
  workflow_dispatch:

jobs:
  verification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # 使用較新的 LTS 版本
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        
      - name: Lint Check
        run: npm run lint
        
      - name: Prettier Check
        run: npm run format:check

      - name: Production Output Check
        run: npm run verify:production
